# Configuración del backend de Inti Crunch (solo Oracle).
server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1          # todas las rutas empiezan con /api/v1

spring:
  application:
    name: inti-crunch-api

  # Conexión a Oracle. La contraseña se pasa al iniciar (no se guarda aquí).
  datasource:
    url: ${ORACLE_DATABASE_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
    username: ${ORACLE_DATABASE_USER:INTICRUNCH_ORACLE}
    password: ${ORACLE_DATABASE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    open-in-view: false
    hibernate:
      # validate: JPA revisa que cada entidad coincida con su tabla, pero NO cambia la base.
      ddl-auto: validate
      naming:
        # "number" es palabra reservada en Oracle; esta clase la escribe como "NUMBER".
        physical-strategy: pe.inticrunch.configuracion.NombresColumnas
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          # Los códigos UUID se guardan como texto VARCHAR2(36).
          preferred_uuid_jdbc_type: VARCHAR
        # Las tablas usan el estilo de Oracle 21c (por ejemplo, sí/no como NUMBER(1)).
        # Así funciona igual en Oracle XE 21c y en Oracle Free 23ai/26ai.
        boot:
          allow_jdbc_metadata_access: false
      jakarta:
        persistence:
          database-product-name: Oracle
          database-major-version: 21

  # Keycloak: quien inicia sesión recibe un token; el backend lo verifica aquí.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/inti-crunch}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/inti-crunch/protocol/openid-connect/certs}

# Datos de la empresa para boletas y facturas.
inti-crunch:
  seller:
    ruc: ${INTI_CRUNCH_RUC:}
